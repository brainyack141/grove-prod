would ship the whole app for free rather than\n  # fail visibly. Fail here instead.\n  if [ -z \"${REVENUECAT_API_KEY:-}\" ]; then\n    echo \"error: REVENUECAT_API_KEY is required for Release. RevenueCat → Project settings → API keys → the public app key for Apple. Add it to .env.production.\"\n    exit 1\n  fi\n  # Secret keys can issue refunds and read every customer record.\n  # One pasted into the wrong variable would ship inside the binary.\n  case \"$REVENUECAT_API_KEY\" in\n    appl_*) : ;;\n    sk_*) echo \"error: REVENUECAT_API_KEY is a RevenueCat secret key. Secret keys must never ship in a binary — use the public Apple SDK key (appl_…).\"; exit 1 ;;\n    *) echo \"error: REVENUECAT_API_KEY must be the public Apple SDK key, which begins with appl_.\"; exit 1 ;;\n  esac\n  # No gateway endpoint is compiled into the source: the analysis and\n  # sync URLs come from Config/Secrets.xcconfig or the command line, and\n  # a Release without them could not scan, ask or sync.\n  for NAME in GROVE_ANALYSIS_URL GROVE_SYNC_URL; do\n    eval \"VALUE=\\\"\\${$NAME:-}\\\"\"\n    case \"$VALUE\" in\n      \"\") echo \"error: $NAME is required for Release. Set it in Config/Secrets.xcconfig (copy Config/Secrets.example.xcconfig) or pass it to xcodebuild.\"; exit 1 ;;\n      https://*) : ;;\n      *) echo \"error: $NAME must be an https URL in Release builds.\"; exit 1 ;;\n    esac\n  done\nfi\n";

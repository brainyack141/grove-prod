<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>You've been invited to Grove</title>
  </head>
  <body style="margin:0; padding:0; background-color:#F4EDDF; -webkit-font-smoothing:antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4EDDF;">
      <tr>
        <td align="center" style="padding:36px 16px 28px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; margin:0 auto;">
            <tr>
              <td align="center" style="padding-bottom:22px;">
                <span style="font-family:Georgia,'Times New Roman',serif; font-size:27px; font-weight:700; letter-spacing:0.01em; color:#233F2B;">Grove</span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#FFFCF5; border:1px solid #E4DCCC; border-radius:20px; padding:34px 28px 30px 28px;">
                <p style="margin:0 0 10px 0; font-family:Georgia,'Times New Roman',serif; font-size:22px; line-height:1.25; font-weight:700; color:#1C261C;">
                  You've been invited to Grove
                </p>
                <p style="margin:0 0 26px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.55; color:#5F685D;">
                  Grove keeps your houseplants alive — and lets a friend look after them while you're away. Follow the link below to accept.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                  <tr>
                    <td align="center" style="background-color:#233F2B; border-radius:999px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 30px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#FFFCF5; text-decoration:none;">Accept invitation</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:26px 0 0 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; line-height:1.55; color:#898E84;">
                  If you weren't expecting this, you can ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 8px 0 8px;">
                <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#898E84;">
                  Sent by Grove because someone invited this address.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
